# PRM - Please Remind Me
# One container serving the API + the built PWA (mirrors Kage).
# Image is built by .github/workflows/deploy.yml and pulled from GHCR.
# Usage: docker compose pull && docker compose up -d
# NAS-agnostic on purpose — no host-specific paths baked in here; point the
# ./data volume at wherever the target NAS keeps persistent app data.

services:
  prm:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-amoszp}/prm:${PRM_TAG:-latest}
    container_name: prm
    restart: unless-stopped
    ports:
      - "${PORT:-1105}:4478"
    env_file:
      - ./backend/.env
    volumes:
      # Host-side folder that keeps the SQLite database across rebuilds/restarts.
      - ./data:/app/backend/data
    networks:
      - default
      - accounts

networks:
  accounts:
    # Created by the accounts service's compose file.
    external: true
